
name: Build HoleLight APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build HoleLight Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. 获取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装 Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 初始化 Android SDK（关键修复）
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. 检查 SDK 环境
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager
          sdkmanager --version

      # 5. 安装 Android 编译组件
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. 解压 HoleLight 工程
      - name: Extract HoleLight project
        run: |
          mkdir -p holelight-project
          unzip -o HoleLight-AOD-v0.1.0.zip -d holelight-project
          test -f holelight-project/settings.gradle.kts
          test -f holelight-project/app/build.gradle.kts

      # 7. 配置 Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 8. 编译 APK
      - name: Build HoleLight APK
        run: |
          gradle -p holelight-project assembleDebug --stacktrace

      # 9. 检查 APK
      - name: Verify APK
        run: |
          test -f holelight-project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh holelight-project/app/build/outputs/apk/debug/

      # 10. 上传 APK
      - name: Upload HoleLight APK
        uses: actions/upload-artifact@v4
        with:
          name: HoleLight-debug-apk
          path: holelight-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
