
name: Build HoleLight APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      # 1. 下载 GitHub 仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 检查 Android SDK
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          sdkmanager --version

      # 4. 接受 SDK 许可并安装所需组件
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. 解压 HoleLight 工程
      - name: Extract HoleLight project
        run: |
          mkdir -p holelight-project
          unzip -q HoleLight-AOD-v0.1.0.zip -d holelight-project
          echo "Checking project files..."
          ls -la holelight-project
          test -f holelight-project/settings.gradle.kts
          test -f holelight-project/app/build.gradle.kts

      # 6. 配置 Gradle 8.9
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7. 编译 APK
      - name: Build HoleLight APK
        run: |
          gradle -p holelight-project assembleDebug --stacktrace

      # 8. 检查 APK 是否生成
      - name: Verify APK
        run: |
          ls -lh holelight-project/app/build/outputs/apk/debug/
          test -f holelight-project/app/build/outputs/apk/debug/app-debug.apk

      # 9. 上传 APK
      - name: Upload HoleLight APK
        uses: actions/upload-artifact@v4
        with:
          name: HoleLight-debug-apk
          path: holelight-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
