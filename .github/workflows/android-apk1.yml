
name: Build HoleLight Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HoleLight-AOD-v0.2.2-source.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build HoleLight V0.2.2 APK
    runs-on: ubuntu-latest

    steps:
      # 1. 获取 GitHub 仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 配置 Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. 安装 Android 35 编译组件
      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # 5. 配置 Gradle 8.9
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. 解压 V0.2.2 源码工程
      - name: Extract HoleLight project
        shell: bash
        run: |
          set -e

          mkdir -p holelight-project

          unzip -o HoleLight-AOD-v0.2.2-source.zip -d holelight-project

          # 修正 ZIP 内部目录层级
          if [ -f holelight-project/HoleLight-AOD-v0.2.2/settings.gradle.kts ]; then
            shopt -s dotglob nullglob
            mv holelight-project/HoleLight-AOD-v0.2.2/* holelight-project/
            rmdir holelight-project/HoleLight-AOD-v0.2.2

          elif [ -f holelight-project/settings.gradle.kts ]; then
            echo "Project files are already in the correct directory."

          else
            echo "ERROR: Cannot find settings.gradle.kts"
            find holelight-project -maxdepth 5 -type f
            exit 1
          fi

          # 检查关键工程文件
          test -f holelight-project/settings.gradle.kts
          test -f holelight-project/build.gradle.kts
          test -f holelight-project/app/build.gradle.kts
          test -f holelight-project/app/src/main/AndroidManifest.xml

          echo "HoleLight V0.2.2 extraction successful."

      # 7. 编译 Debug APK
      - name: Build Debug APK
        run: |
          gradle --no-daemon -p holelight-project assembleDebug

      # 8. 检查 APK 是否生成
      - name: Verify APK
        run: |
          APK="holelight-project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          echo "APK build successful."
          ls -lh "$APK"

      # 9. 上传 APK 编译产物
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HoleLight-v0.2.2-debug-apk
          path: holelight-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
