
name: Build HoleLight Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HoleLight-AOD-v0.5.1-source.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build HoleLight V0.5.1 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check source archive
        run: |
          ls -lah
          test -f HoleLight-AOD-v0.5.1-source.zip

      - name: Extract source
        shell: bash
        run: |
          set -e
          mkdir -p holelight-project
          unzip -o HoleLight-AOD-v0.5.1-source.zip -d holelight-project

          if [ -f holelight-project/HoleLight-AOD-v0.5.1/settings.gradle.kts ]; then
            shopt -s dotglob nullglob
            mv holelight-project/HoleLight-AOD-v0.5.1/* holelight-project/
            rmdir holelight-project/HoleLight-AOD-v0.5.1
          fi

          test -f holelight-project/settings.gradle.kts
          test -f holelight-project/app/build.gradle.kts

      - name: Build Debug APK
        run: gradle --no-daemon -p holelight-project assembleDebug

      - name: Verify APK
        run: |
          test -f holelight-project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh holelight-project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HoleLight-v0.5.1-debug-apk
          path: holelight-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
